# Service schedule. Read by scripts/ops/translate-window-check.sh every five
# minutes and edited from /admin, so it is deliberately dumb: one directive per
# line, no nesting, parseable by both shell and Python.
#
#   window DAY HH:MM HH:MM    DAY is 1=Mon .. 7=Sun (ISO, as `date +%u` gives)
#   drain_min N               stop claiming archive jobs this long before a window
#
# Translation starts at the window's start time, not the service time — the
# stack needs ~40s to load models and the room is usually quiet before a
# service, so the window opens early on purpose.
#
# drain_min sizing: archive jobs measured 2026-09-06 over 20 runs ran a median
# of 10 min, p90 26 min and a maximum of 40 min. At 30 a worst-case job claimed
# just before the drain point is still running ten minutes into a service,
# competing for the GPU. Raising it costs idle GPU time before every service;
# the better fix is for the worker to refuse jobs it cannot finish, which lives
# in the sister project.
drain_min 45

# Sunday morning: service 10:00
window 7 09:15 12:45
# Sunday evening: service 19:00
window 7 18:15 21:00
# Wednesday evening: service 19:30
window 3 17:45 21:15
