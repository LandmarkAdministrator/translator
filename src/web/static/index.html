<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Translation</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#175E54">
<meta name="mobile-web-app-capable" content="yes">
<!-- iOS still reads the apple-prefixed tags for home-screen launch -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Translation">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #F5F4F0; --card: #FFFFFF; --ink: #23211C; --muted: #8A8578;
    --line: #DDD9CF; --accent: #175E54; --accent-soft: #E3EEEC; --pending: #9A9484;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14130F; --card: #1E1C17; --ink: #EAE7DF; --muted: #928C7D;
            --line: #33302A; --accent: #5FB3A5; --accent-soft: #1C2E2B; --pending: #6E695E; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; min-height: 100dvh;
  }
  header {
    position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line);
    padding: 10px 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
    padding-top: calc(10px + env(safe-area-inset-top));
  }
  header h1 { font-size: 16px; margin: 0 auto 0 0; font-weight: 600; letter-spacing: .02em; }
  .langs { display: flex; gap: 6px; }
  .langs button {
    font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer;
  }
  .langs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  #listen {
    font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent);
  }
  #listen[aria-pressed="true"] { background: var(--accent); color: #fff; }
  #listen[hidden] { display: none; }
  #status { font-size: 12px; color: var(--muted); }
  #phones {
    margin: 0; padding: 8px 14px; font-size: 13px; text-align: center;
    color: var(--accent); background: var(--accent-soft);
    border-bottom: 1px solid var(--line);
  }
  #phones[hidden] { display: none; }
  main { flex: 1; max-width: 46rem; width: 100%; margin: 0 auto; padding: 16px 14px 40vh; }
  p.line { margin: 0 0 .7em; }
  #pending { color: var(--pending); }
  #pending::after { content: "▍"; opacity: .6; animation: blink 1.1s step-start infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .replay { opacity: .55; }
  #standby {
    max-width: 30rem; margin: 12vh auto 0; text-align: center; color: var(--muted);
  }
  #standby[hidden] { display: none; }
  #standby .mark { font-size: 30px; line-height: 1; margin-bottom: 12px; opacity: .5; }
  #standby h2 { font-size: 17px; margin: 0 0 6px; color: var(--fg); font-weight: 600; }
  #standby p { margin: 0; font-size: 14px; }
  #standby .times { margin-top: 14px; font-size: 13px; line-height: 1.7; }
  footer {
    text-align: center; color: var(--muted); font-size: 12px;
    padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
  }
</style>
</head>
<body>
<header>
  <h1>Live Translation</h1>
  <nav class="langs" id="langs">
    <button data-lang="en" aria-pressed="true">English</button>
    <button data-lang="es" aria-pressed="false">Español</button>
    <button data-lang="ht" aria-pressed="false">Kreyòl</button>
  </nav>
  <button id="listen" hidden aria-pressed="false">🔊 Listen</button>
  <span id="status">connecting…</span>
</header>
<p id="phones" hidden></p>
<main id="pane">
  <div id="standby" hidden>
    <div class="mark">◦</div>
    <h2 id="sb-title">No service in progress</h2>
    <p id="sb-body">Live translation will appear here automatically when the service begins.</p>
    <div class="times" id="sb-times"></div>
  </div>
  <div id="lines"></div>
  <p class="line" id="pending"></p>
</main>
<footer>Landmark Baptist Church · live machine translation</footer>
<script>
(function () {
  "use strict";
  var lang = "en";
  var listening = false;
  var linesEl = document.getElementById("lines");
  var pendingEl = document.getElementById("pending");
  var statusEl = document.getElementById("status");
  var listenBtn = document.getElementById("listen");
  var pendingWords = [];
  var texts = { en: [], es: [], ht: [] };   // finished lines per language
  var MAX_LINES = 300;

  // ---- audio (gapless per-sentence scheduling) -------------------------
  var ctx = null, nextStart = 0;
  function ensureCtx() {
    if (!ctx) { ctx = new (window.AudioContext || window.webkitAudioContext)(); nextStart = 0; }
    if (ctx.state === "suspended") ctx.resume();
  }
  function playWav(buf) {
    if (!listening || !ctx) return;
    ctx.decodeAudioData(buf.slice(0), function (audio) {
      var src = ctx.createBufferSource();
      src.buffer = audio;
      src.connect(ctx.destination);
      nextStart = Math.max(ctx.currentTime + 0.05, nextStart);
      src.start(nextStart);
      nextStart += audio.duration;
    });
  }

  // ---- rendering --------------------------------------------------------
  function nearBottom() {
    return window.innerHeight + window.scrollY >= document.body.scrollHeight - 160;
  }
  function render() {
    var list = texts[lang];
    var html = "";
    for (var i = Math.max(0, list.length - MAX_LINES); i < list.length; i++) {
      html += '<p class="line' + (list[i].replay ? " replay" : "") + '">' + esc(list[i].text) + "</p>";
    }
    var stick = nearBottom();
    linesEl.innerHTML = html;
    pendingEl.textContent = lang === "en" ? pendingWords.join(" ") : "";
    pendingEl.style.display = (lang === "en" && pendingWords.length) ? "" : "none";
    if (stick) window.scrollTo(0, document.body.scrollHeight);
  }
  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function push(l, text, replay) {
    texts[l].push({ text: text, replay: !!replay });
    if (texts[l].length > MAX_LINES * 2) texts[l] = texts[l].slice(-MAX_LINES);
    if (l === lang) render();
  }

  // ---- events -----------------------------------------------------------
  function onEvent(ev, binary) {
    if (binary) {
      if (ev.kind === lang + ".audio") playWav(binary);
      return;
    }
    if (ev.kind === "status") {
      setLive(ev.live);
      return;
    }
    if (ev.kind === "en.commit") {
      var ws = ev.text.trim().split(/\s+/).filter(Boolean);
      pendingWords = pendingWords.concat(ws);
      if (lang === "en") render();
    } else if (ev.kind === "en.sentence") {
      var n = ev.text.trim().split(/\s+/).filter(Boolean).length;
      pendingWords = pendingWords.slice(n);
      push("en", ev.text, ev.replay);
    } else if (ev.kind === "es.text") {
      push("es", ev.text, ev.replay);
    } else if (ev.kind === "ht.text") {
      push("ht", ev.text, ev.replay);
    }
  }

  // ---- per-language wording ---------------------------------------------
  // Someone who needs the Spanish or Creole feed cannot necessarily read the
  // English label on the button they have to press, so the control speaks the
  // language it delivers. The headphone note matters in a full auditorium:
  // audio out of a phone speaker carries to everyone nearby.
  // Service times are the congregation's, not the translator's — someone
  // reading this is deciding when to come back, not when software starts.
  var TIMES = {
    en: "Sunday 10:00 am &amp; 7:00 pm<br>Wednesday 7:30 pm",
    es: "Domingo 10:00 am y 7:00 pm<br>Miércoles 7:30 pm",
    ht: "Dimanch 10:00 am ak 7:00 pm<br>Mèkredi 7:30 pm"
  };
  var STRINGS = {
    en: { listen: "🔊 Listen",    listening: "🔊 Listening",  phones: "",
          sbTitle: "No service in progress",
          sbBody: "Live translation will appear here automatically when the service begins." },
    es: { listen: "🔊 Escuchar",  listening: "🔊 Escuchando",
          phones: "Usa audífonos para no molestar a los demás.",
          sbTitle: "No hay servicio en este momento",
          sbBody: "La traducción en vivo aparecerá aquí automáticamente cuando comience el servicio." },
    ht: { listen: "🔊 Koute",     listening: "🔊 Ap koute",
          phones: "Tanpri sèvi ak ekoutè pou ou pa deranje lòt moun.",
          sbTitle: "Pa gen sèvis kounye a",
          sbBody: "Tradiksyon an dirèk ap parèt isit la otomatikman lè sèvis la kòmanse." }
  };
  var phonesEl = document.getElementById("phones");
  function applyLang() {
    var s = STRINGS[lang] || STRINGS.en;
    listenBtn.textContent = listening ? s.listening : s.listen;
    listenBtn.hidden = (lang === "en") || live === false;
    phonesEl.textContent = s.phones;
    phonesEl.hidden = !s.phones || live === false;
    document.getElementById("sb-title").textContent = s.sbTitle;
    document.getElementById("sb-body").textContent = s.sbBody;
    document.getElementById("sb-times").innerHTML = TIMES[lang] || TIMES.en;
  }
  applyLang();   // render the standby copy before the first status arrives

  // ---- live / standby ---------------------------------------------------
  // The server stays up between services, so "connected" and "a service is
  // running" are different things; the page has to say which one it means.
  var standbyEl = document.getElementById("standby");
  var live = null;
  function setLive(on) {
    on = !!on;
    if (on === live) return;
    live = on;
    standbyEl.hidden = on;
    linesEl.hidden = !on;
    pendingEl.hidden = !on;
    // English is text-only, so the button stays hidden there either way.
    applyLang();
    statusEl.textContent = on ? "live" : "standby";
    if (!on) {
      // Drop the finished service's transcript so the next one starts clean.
      texts = { en: [], es: [], ht: [] };
      pendingWords = [];
      render();
    }
  }

  // ---- websocket with reconnect ----------------------------------------
  var retry = 1000;
  function connect() {
    var ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
    ws.binaryType = "arraybuffer";
    ws.onopen = function () { statusEl.textContent = "live"; retry = 1000; };
    ws.onmessage = function (m) {
      if (typeof m.data === "string") {
        try { onEvent(JSON.parse(m.data), null); } catch (e) {}
      } else {
        var dv = new DataView(m.data);
        var hlen = dv.getUint32(0, true);
        var head = JSON.parse(new TextDecoder().decode(new Uint8Array(m.data, 4, hlen)));
        onEvent(head, m.data.slice(4 + hlen));
      }
    };
    ws.onclose = function () {
      statusEl.textContent = "reconnecting…";
      setTimeout(connect, retry);
      retry = Math.min(retry * 2, 15000);
    };
  }
  connect();

  // Installable app: register the shell worker. Failure is non-fatal — the
  // page works identically without it, just not installable/offline-tolerant.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js").catch(function () {});
    });
  }

  // ---- controls ---------------------------------------------------------
  document.getElementById("langs").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-lang]");
    if (!b) return;
    lang = b.dataset.lang;
    this.querySelectorAll("button").forEach(function (x) {
      x.setAttribute("aria-pressed", String(x === b));
    });
    applyLang();
    render();
  });
  listenBtn.addEventListener("click", function () {
    listening = !listening;
    this.setAttribute("aria-pressed", String(listening));
    applyLang();
    if (listening) ensureCtx();
  });
})();
</script>
</body>
</html>
